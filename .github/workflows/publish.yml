name: Publish

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    uses: homelabforge/shared-workflows/.github/workflows/python-react-publish.yml@v1.4.3
    with:
      enable-translations: true
      security-tripwire-script: .github/scripts/security-tripwire.sh
      # Use the repo that triggered the workflow so fork publishes land under
      # ghcr.io/<owner>/<repo> (e.g. sickkick/mygarage), not the upstream org.
      image-name: ${{ github.repository }}
      release-name-prefix: 'MyGarage v'
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
